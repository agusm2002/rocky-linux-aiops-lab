# ============================================================
# Deployment de HashiCorp Vault — modo dev para laboratorio
# ============================================================
#
# MODO DEV vs PRODUCCIÓN — diferencias clave:
#
# | Aspecto              | Modo Dev                        | Producción                    |
# |--------------------- |---------------------------------|-------------------------------|
# | Almacenamiento       | En memoria (se pierde al reiniciar) | Raft/Consul (persistente) |
# | Unseal               | Automático (no requiere claves) | Manual (3 de 5 unseal keys)  |
# | Root token           | Fijado por env var              | Generado en `vault operator init` |
# | TLS                  | Deshabilitado por defecto       | Obligatorio                  |
# | Audit logging        | Deshabilitado                   | Recomendado                  |
# | Datos sensibles      | No cifrados en reposo           | Cifrados con Shamir          |
#
# ⚠️  NUNCA usar modo dev en producción.  El token "dev-root-token"
#     es conocido y el almacenamiento es volátil — cualquier persona
#     con acceso al cluster puede leer todos los secrets.
#
# Este Deployment usa el flag `-dev` del binario de Vault, que activa
# todas las características de desarrollo: almacén en memoria, auto-
# unseal, y el token raíz especificado en VAULT_DEV_ROOT_TOKEN_ID.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
    name: vault
    namespace: aiops
    labels:
        app: vault
spec:
    replicas: 1 # Single replica — modo dev no soporta HA
    selector:
        matchLabels:
            app: vault
    template:
        metadata:
            labels:
                app: vault
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/port: "8200"
                prometheus.io/path: "/v1/metrics"
        spec:
            serviceAccountName: vault
            containers:
                - name: vault
                  # Vault necesita IPC_LOCK para mlock() — previene swap de memoria.
                  # En modo dev, disable_mlock=true, pero el capability sigue siendo
                  # necesario para que el binario arranque sin errores.
                  securityContext:
                      capabilities:
                          add: ["IPC_LOCK"]
                  image: hashicorp/vault:1.16.2
                  command: ["vault", "server", "-dev"] # Flag -dev activa modo desarrollo
                  ports:
                      - name: http
                        containerPort: 8200 # Puerto de la API HTTP de Vault
                      - name: internal
                        containerPort: 8201 # Puerto interno del cluster (no usado en dev)
                  env:
                      # Token raíz fijo — solo para laboratorio.
                      # En producción, `vault operator init` genera un token único.
                      - name: VAULT_DEV_ROOT_TOKEN_ID
                        value: "dev-root-token"
                      # Dirección de escucha en todas las interfaces del pod.
                      - name: VAULT_DEV_LISTEN_ADDRESS
                        value: "0.0.0.0:8200"
                      # Vault escucha en HTTP en modo dev.  En producción, siempre HTTPS.
                      - name: VAULT_ADDR
                        value: "http://127.0.0.1:8200"
                  readinessProbe:
                      httpGet:
                          path: /v1/sys/health
                          port: 8200
                      initialDelaySeconds: 5
                      periodSeconds: 5
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /v1/sys/health
                          port: 8200
                      initialDelaySeconds: 15
                      periodSeconds: 15
                      failureThreshold: 3
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                  # No montamos volumen persistente — en modo dev, Vault usa
                  # almacenamiento en memoria que se pierde al reiniciar el pod.
                  # Esto es intencional para el lab y se documenta como diferencia
                  # con producción (que usaría PVC con Raft storage).
