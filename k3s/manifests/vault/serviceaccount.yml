# ServiceAccount para Vault server
# El propio Vault server no necesita permisos RBAC especiales en el cluster.
# En modo dev, Vault opera de forma autónoma sin interactuar con la API de K8s.
# El ServiceAccount se usa principalmente para el método de autenticación
# Kubernetes de Vault (los pods lo usan para autenticarse con Vault).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: aiops
  labels:
    app: vault
