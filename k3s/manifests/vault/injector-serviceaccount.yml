# ServiceAccount y RBAC para Vault Agent Injector
#
# El Injector es un webhook mutante que observa la creación de pods.
# Cuando un pod tiene las annotations de Vault Agent, el Injector
# modifica el spec del pod para añadir un contenedor sidecar que
# recupera secrets de Vault en runtime.
#
# Permisos requeridos:
# - Secrets: crear/leer para gestionar certificados TLS del webhook
# - ServiceAccounts: leer para verificar identidades de pods
# - MutatingWebhookConfigurations: leer/actualizar para inyectar el CA bundle
# - TokenReviews: crear para validar ServiceAccount tokens
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: vault-agent-injector
    namespace: aiops
    labels:
        app: vault-agent-injector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: vault-agent-injector
    labels:
        app: vault-agent-injector
rules:
    # El Injector gestiona el Secret TLS del webhook
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
    # Lee ServiceAccounts para validar la identidad de los pods
    - apiGroups: [""]
      resources: ["serviceaccounts"]
      verbs: ["get", "list", "watch"]
    # Lee ConfigMaps para verificar configuración del agente
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list", "watch"]
    # El Injector actualiza el CA bundle del webhook dinámicamente
    - apiGroups: ["admissionregistration.k8s.io"]
      resources: ["mutatingwebhookconfigurations"]
      verbs: ["get", "list", "watch", "update", "patch"]
    # Valida tokens de ServiceAccount de los pods que solicitan secrets
    - apiGroups: ["authentication.k8s.io"]
      resources: ["tokenreviews"]
      verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: vault-agent-injector
    labels:
        app: vault-agent-injector
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: vault-agent-injector
subjects:
    - kind: ServiceAccount
      name: vault-agent-injector
      namespace: aiops
    # El server de Vault también necesita crear TokenReviews para validar
    # JWT tokens de los pods que solicitan secrets vía Kubernetes auth.
    # Sin este permiso, Vault devuelve 403 al intentar validar tokens.
    - kind: ServiceAccount
      name: vault
      namespace: aiops
