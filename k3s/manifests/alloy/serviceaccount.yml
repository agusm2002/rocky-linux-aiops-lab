# ServiceAccount para Grafana Alloy — proporciona identidad al pod de Alloy
# para autenticarse con la API de Kubernetes.
#
# Alloy usa discovery.kubernetes para descubrir pods y extraer sus labels
# (nombre, namespace, contenedor, etc.) como etiquetas de los logs. Esta
# operación requiere un ServiceAccount con permisos de lectura (list, watch)
# sobre pods en el namespace aiops. Sin este ServiceAccount, Alloy no puede
# autenticarse y el discovery falla silenciosamente — los logs no tendrían
# las etiquetas correctas para filtrarlos en Grafana.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: aiops
