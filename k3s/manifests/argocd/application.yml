apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: aiops-lab
    namespace: argocd
spec:
    project: default
    source:
        repoURL: https://github.com/agusm2002/rocky-linux-aiops-lab
        targetRevision: main
        path: k3s/manifests
        directory:
            recurse: true
            exclude: "{workflows/*,*.json}"
    destination:
        server: https://kubernetes.default.svc
        namespace: aiops
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
    ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: vault-agent-injector
          jsonPointers:
              - /webhooks/0/clientConfig/caBundle
