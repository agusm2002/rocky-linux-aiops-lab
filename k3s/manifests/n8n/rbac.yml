# RBAC para n8n — lectura de pods en el cluster
#
# Propósito: permitir que n8n consulte la API de Kubernetes para el
# Workflow 3 (Health Check y Auto-Remediation).
#
# Sin estos permisos, el HTTP Request node de n8n que llama a:
#   https://kubernetes.default.svc/api/v1/namespaces/aiops/pods
# recibe un 403 Forbidden porque el ServiceAccount 'n8n' no tiene
# autorización sobre el recurso 'pods'.
#
# Alcance: los permisos son de lectura únicamente (get, list, watch).
# n8n NO puede crear, modificar ni eliminar pods — principio de
# mínimo privilegio.  Si en el futuro se quiere auto-remediation
# (ej. reiniciar un pod), habría que agregar el verbo 'delete'.
#
# Nota: usamos ClusterRole (no Role) porque n8n podría necesitar
# leer pods de múltiples namespaces en un escenario multi-tenant.
# En este lab solo se usa el namespace aiops, pero el binding
# ya apunta al ServiceAccount correcto.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: n8n-pod-reader
    labels:
        app: n8n
        app.kubernetes.io/part-of: aiops-lab
rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: n8n-pod-reader-binding
    labels:
        app: n8n
        app.kubernetes.io/part-of: aiops-lab
subjects:
    - kind: ServiceAccount
      name: n8n
      namespace: aiops
roleRef:
    kind: ClusterRole
    name: n8n-pod-reader
    apiGroup: rbac.authorization.k8s.io
