# ============================================================
# Secret para n8n — clave de cifrado de credenciales
# ============================================================
# ADVERTENCIA IMPORTANTE: N8N_ENCRYPTION_KEY es la clave maestra
# que n8n usa para cifrar TODAS las credenciales almacenadas en
# su base de datos (SQLite).  Si esta clave se pierde o cambia
# después de que se hayan creado workflows con credenciales,
# n8n NO podrá descifrar las credenciales existentes y se
# perderá el acceso a ellas.  Por lo tanto:
#   1. NUNCA se debe eliminar o rotar manualmente esta clave
#      mientras haya credenciales cifradas con ella.
#   2. El valor actual es un PLACEHOLDER y DEBE ser reemplazado
#      por una clave real generada con: openssl rand -base64 32
#
# En Phase 3, HashiCorp Vault Agent inyectará esta variable
# directamente en el contenedor mediante annotations, eliminando
# la necesidad de almacenar el secreto como recurso nativo de
# Kubernetes.  Hasta entonces, este Secret actúa como almacén
# temporal.  Cuando Vault tome el control, el proceso de rotación
# se podrá automatizar de forma segura (creando una nueva clave,
# re-cifrando las credenciales y rotando sin downtime).
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret           # Nombre del Secret, referenciado por el Deployment
  namespace: aiops           # Namespace compartido por todo el lab
type: Opaque                 # Tipo genérico para datos arbitrarios clave-valor
data:
  # Valor codificado en base64. El valor decodificado es un placeholder:
  #   echo -n 'n01-encryption-key-temp-replace-me' | base64
  # ⚠️  Reemplazar con una clave real de 32+ caracteres antes de desplegar.
  #     Ejemplo: openssl rand -base64 32 | tr -d '\n'
  N8N_ENCRYPTION_KEY: "bm8xLWVuY3J5cHRpb24ta2V5LXRlbXAtcmVwbGFjZS1tZQ=="
