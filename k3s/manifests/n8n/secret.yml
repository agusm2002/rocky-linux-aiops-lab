# ============================================================
# Secret para n8n — REEMPLAZADO por HashiCorp Vault
# ============================================================
# ⚠️  ESTE ARCHIVO ESTÁ OBSOLETO — NO SE USA EN PRODUCCIÓN
#
# Desde la Fase 3, n8n lee su clave de cifrado desde
# Vault Agent Injector, NO desde este Secret.
#
# El flujo actual es:
#   1. Vault Agent Injector detecta las annotations en el Deployment
#   2. Inyecta un init container (vault-agent-init) en el pod
#   3. vault-agent-init obtiene el secret desde Vault y lo escribe
#      en /vault/secrets/n8n-env con formato shell export
#   4. El contenedor principal sourcea ese archivo antes de arrancar
#      n8n, exportando N8N_ENCRYPTION_KEY como variable de entorno
#
# Este archivo se mantiene solo como referencia histórica.
# Para eliminarlo completamente:
#   kubectl delete secret n8n-secret -n aiops
# ============================================================

apiVersion: v1
kind: Secret
metadata:
    name: n8n-secret # Nombre (ya NO referenciado por el Deployment)
    namespace: aiops # Namespace compartido por todo el lab
type: Opaque
data:
    # Valor codificado en base64. El valor decodificado es un placeholder:
    #   echo -n 'n01-encryption-key-temp-replace-me' | base64
    # ⚠️  REEMPLAZADO — Vault inyecta la clave real en runtime.
    # Este valor es un placeholder que ya no se monta en el pod.
    N8N_ENCRYPTION_KEY: "bm8xLWVuY3J5cHRpb24ta2V5LXRlbXAtcmVwbGFjZS1tZQ=="
