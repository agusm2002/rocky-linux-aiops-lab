# ============================================================
# ConfigMap para n8n — variables de entorno no sensibles
# ============================================================
# Este ConfigMap agrupa toda la configuración "plana" de n8n que
# NO contiene secretos.  Las variables sensibles (como la clave
# de cifrado) viven en un Secret separado para que cada tipo de
# recurso tenga su propio ciclo de vida y permisos RBAC.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
    name: n8n-config
    namespace: aiops
data:
    # --- Configuración de red y URL ---
    N8N_HOST: "n8n.local"
    N8N_PORT: "5678"
    N8N_PROTOCOL: "http"
    N8N_EDITOR_BASE_URL: "http://n8n.local"

    # --- Observabilidad ---
    N8N_METRICS: "true"

    # --- Privacidad ---
    N8N_DIAGNOSTICS_ENABLED: "false"

    # --- Cookies seguras ---
    # Permite acceder por HTTP sin que el navegador rechace las cookies.
    # En producción se usa HTTPS y esto va en true, pero en el lab
    # no tenemos TLS. Sin esto, n8n muestra un error de "secure cookie"
    # y no deja cargar la UI.
    N8N_SECURE_COOKIE: "false"

    # --- Acceso a variables de entorno en nodos ---
    # Por defecto n8n 2.x bloquea $env en expresiones por seguridad.
    # Los workflows de este lab leen N8N_OPENCODE_API_KEY y
    # N8N_DISCORD_WEBHOOK_URL desde env vars inyectadas por Vault.
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

    # --- Localización ---
    GENERIC_TIMEZONE: "America/Argentina/Buenos_Aires"
    TZ: "America/Argentina/Buenos_Aires"
