# ServiceAccount para n8n
#
# Vault Agent usa el token JWT del ServiceAccount del pod para
# autenticarse con Vault (método Kubernetes auth).  El rol 'n8n'
# en Vault está vinculado a este ServiceAccount — ningún otro pod
# puede acceder a los secrets de n8n en Vault.
---
apiVersion: v1
kind: ServiceAccount
metadata:
    name: n8n
    namespace: aiops
    labels:
        app: n8n
automountServiceAccountToken: true
