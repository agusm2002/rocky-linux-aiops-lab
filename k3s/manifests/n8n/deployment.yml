# Deployment de n8n — motor de automatización de workflows
#
# n8n se despliega como Deployment con 1 réplica porque su modo
# predeterminado usa SQLite como backend, lo cual NO soporta
# múltiples escritores simultáneos.  Para escalar horizontalmente
# sería necesario cambiar a "queue mode" con Redis y PostgreSQL,
# lo cual está fuera del alcance de este lab de nodo único.
#
# El contenedor se ejecuta como usuario no-root (UID 1000 = node)
# por dos motivos:
#   1. Seguridad: si el proceso se ve comprometido, el atacante
#      obtiene un usuario sin privilegios dentro del contenedor.
#   2. Compatibilidad con k3s: las imágenes oficiales de n8n
#      están diseñadas para correr como usuario 'node' (UID 1000).
#
# ── Inyección de secrets con Vault Agent (Fase 3) ──
#
# La clave de cifrado N8N_ENCRYPTION_KEY se inyecta desde Vault
# mediante Vault Agent Injector.  El flujo es:
#   1. El pod se crea con annotations de Vault Agent
#   2. El Injector añade un init container (vault-agent-init)
#   3. vault-agent-init se autentica con Vault usando el
#      ServiceAccount 'n8n' y obtiene el secret
#   4. vault-agent-init escribe un archivo shell en /vault/secrets/n8n-env
#      con el formato: export N8N_ENCRYPTION_KEY="..."
#   5. El contenedor principal ejecuta: source /vault/secrets/n8n-env && n8n start
#
# Antes (Fase 1-4): La clave venía de un Kubernetes Secret estático (envFrom)
# Ahora (Fase 3):   La clave se inyecta desde Vault en runtime, sin secretRef

apiVersion: apps/v1
kind: Deployment
metadata:
    name: n8n
    namespace: aiops
    labels:
        app: n8n
    annotations:
        # --- Annotations de Vault Agent Injector ---
        # Habilitar la inyección de Vault Agent en este pod
        vault.hashicorp.com/agent-inject: "true"
        # Rol de Vault que autoriza a este pod a leer secrets
        # Vinculado al ServiceAccount 'n8n' en el namespace 'aiops'
        vault.hashicorp.com/role: "n8n"
        # Secret a inyectar: path en Vault (kv-v2: secret/data/n8n)
        vault.hashicorp.com/agent-inject-secret-n8n-env: "secret/data/n8n"
        # Template que genera un archivo con formato shell export.
        # n8n no soporta el patrón __FILE como Grafana, por lo que
        # generamos un archivo exportable que el command sourcea
        # antes de arrancar n8n.
        vault.hashicorp.com/agent-inject-template-n8n-env: |
            {{- with secret "secret/data/n8n" -}}
            export N8N_ENCRYPTION_KEY="{{ .Data.data.encryption_key }}"
            {{- end }}
        # Solo usar el init container, no sidecar (los secrets no cambian en runtime)
        vault.hashicorp.com/agent-pre-populate-only: "true"
spec:
    replicas: 1
    selector:
        matchLabels:
            app: n8n
    template:
        metadata:
            labels:
                app: n8n
            # Las annotations de Vault se leen del spec.metadata.annotations
            # del Deployment, las cuales el Injector detecta al crear el pod.
        spec:
            serviceAccountName: n8n # ServiceAccount vinculado al rol de Vault
            securityContext:
                runAsUser: 1000
                runAsNonRoot: true
                fsGroup: 1000
            containers:
                - name: n8n
                  image: n8nio/n8n:2.22.2
                  # El command sourcea el archivo inyectado por Vault Agent
                  # antes de arrancar n8n.  Esto exporta N8N_ENCRYPTION_KEY
                  # como variable de entorno visible para el proceso de n8n.
                  # /vault/secrets/n8n-env contiene: export N8N_ENCRYPTION_KEY="..."
                  command: ["/bin/sh", "-c"]
                  args:
                      - |
                          # Sourcear las variables inyectadas por Vault Agent
                          if [ -f /vault/secrets/n8n-env ]; then
                            . /vault/secrets/n8n-env
                          fi
                          # Arrancar n8n con las variables de entorno disponibles
                          n8n start
                  ports:
                      - name: http
                        containerPort: 5678
                  envFrom:
                      # Solo cargamos variables NO sensibles desde el ConfigMap.
                      # La clave de cifreo (N8N_ENCRYPTION_KEY) ya no viene de
                      # un Secret estático — se inyecta desde Vault en runtime
                      # mediante el archivo /vault/secrets/n8n-env.
                      - configMapRef:
                            name: n8n-config
                  volumeMounts:
                      - name: n8n-data
                        mountPath: /home/node/.n8n
                      # El volumen /vault/secrets es inyectado automáticamente por
                      # Vault Agent Injector.  No necesitamos montarlo manualmente.
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: 5678
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 5678
                      initialDelaySeconds: 30
                      periodSeconds: 15
                      failureThreshold: 3
            volumes:
                - name: n8n-data
                  persistentVolumeClaim:
                      claimName: n8n-pvc
