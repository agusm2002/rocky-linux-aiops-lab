# Deployment de n8n — motor de automatización de workflows
#
# n8n se despliega como Deployment con 1 réplica porque su modo
# predeterminado usa SQLite como backend, lo cual NO soporta
# múltiples escritores simultáneos.  Para escalar horizontalmente
# sería necesario cambiar a "queue mode" con Redis y PostgreSQL,
# lo cual está fuera del alcance de este lab de nodo único.
#
# El contenedor se ejecuta como usuario no-root (UID 1000 = node)
# por dos motivos:
#   1. Seguridad: si el proceso se ve comprometido, el atacante
#      obtiene un usuario sin privilegios dentro del contenedor.
#   2. Compatibilidad con k3s: las imágenes oficiales de n8n
#      están diseñadas para correr como usuario 'node' (UID 1000).

apiVersion: apps/v1
kind: Deployment
metadata:
    name: n8n
    namespace: aiops
    labels:
        app: n8n
spec:
    replicas: 1
    selector:
        matchLabels:
            app: n8n
    template:
        metadata:
            labels:
                app: n8n
        spec:
            securityContext:
                runAsUser: 1000
                runAsNonRoot: true
                fsGroup: 1000
            containers:
                - name: n8n
                  image: n8nio/n8n:2.22.2
                  ports:
                      - name: http
                        containerPort: 5678
                  envFrom:
                      - configMapRef:
                            name: n8n-config
                      - secretRef:
                            name: n8n-secret
                  volumeMounts:
                      - name: n8n-data
                        mountPath: /home/node/.n8n
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "100m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: 5678
                      initialDelaySeconds: 15
                      periodSeconds: 10
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 5678
                      initialDelaySeconds: 30
                      periodSeconds: 15
                      failureThreshold: 3
            volumes:
                - name: n8n-data
                  persistentVolumeClaim:
                      claimName: n8n-pvc
