# ServiceAccount para Grafana
#
# Vault Agent usa el token JWT del ServiceAccount del pod para
# autenticarse con Vault (método Kubernetes auth).  Sin este
# ServiceAccount, el Vault Agent no tendría identidad para
# acceder a los secrets de grafana en Vault.
#
# El rol 'grafana' en Vault está configurado para aceptar
# exclusivamente este ServiceAccount en el namespace aiops.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: aiops
  labels:
    app: grafana
