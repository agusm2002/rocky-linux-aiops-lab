# ============================================================
# Secret para Grafana — REEMPLAZADO por HashiCorp Vault
# ============================================================
# ⚠️  ESTE ARCHIVO ESTÁ OBSOLETO — NO SE USA EN PRODUCCIÓN
#
# Desde la Fase 3, Grafana lee su contraseña de admin desde
# Vault Agent Injector, NO desde este Secret.
#
# El flujo actual es:
#   1. Vault Agent Injector detecta las annotations en el Deployment
#   2. Inyecta un init container (vault-agent-init) en el pod
#   3. vault-agent-init obtiene el secret desde Vault y lo escribe
#      en /vault/secrets/admin-password
#   4. Grafana lee la contraseña desde ese archivo usando
#      GF_SECURITY_ADMIN_PASSWORD__FILE=/vault/secrets/admin-password
#
# Este archivo se mantiene solo como referencia histórica.
# Para eliminarlo completamente:
#   kubectl delete secret grafana-admin-secret -n aiops
# ============================================================

apiVersion: v1
kind: Secret
metadata:
    name: grafana-admin-secret # Nombre referenciado (ya NO usado por el Deployment)
    namespace: aiops
    labels:
        app: grafana
type: Opaque
data:
    # Contraseña codificada en base64.  Valor original: "admin"
    # ⚠️  REEMPLAZADO — Vault inyecta la contraseña real en runtime.
    # Este valor es un placeholder que ya no se monta en el pod.
    admin-password: YWRtaW4=
