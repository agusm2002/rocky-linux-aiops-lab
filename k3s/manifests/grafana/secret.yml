# ============================================================
# Secret: grafana-admin-secret
# ============================================================
# Este Secret es TEMPORAL y será reemplazado por Vault en la
# Fase 3 del laboratorio.  Contiene la contraseña del usuario
# admin de Grafana codificada en base64 (valor: "admin").
#
# Flujo previsto:
#   Fase 1-2: El Deployment monta este Secret en /etc/secrets/
#             y Grafana lee la contraseña desde el archivo
#             (patrón __FILE).
#   Fase 3:  Vault Agent Injector sobreescribe este mount con
#             la contraseña real generada dinámicamente.  El
#             sufijo __FILE en GF_SECURITY_ADMIN_PASSWORD__FILE
#             es compatible con la inyección de archivos de
#             Vault, por lo que no se necesitan cambios en el
#             Deployment cuando se migre a Vault.
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret         # Nombre referenciado en el Deployment
  namespace: aiops
  labels:
    app: grafana
type: Opaque                        # Tipo genérico — no tiene estructura específica
data:
  # Contraseña codificada en base64.  Valor original: "admin"
  # ¡CAMBIAR EN PRODUCCIÓN!  Este es un placeholder intencional.
  # En la Fase 3, Vault inyectará la contraseña real.
  admin-password: YWRtaW4=
