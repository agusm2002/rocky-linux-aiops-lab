# ============================================================
# ConfigMap: grafana-dashboards
# ============================================================
# Contiene dashboards pre-cargados como JSON embebido.
# Pre-cargar dashboards elimina la configuración manual y demuestra
# prácticas GitOps: el estado deseado del dashboard vive en el repo
# y se aplica automáticamente al desplegar Grafana.
#
# Dashboards incluidos:
#   1. cluster-overview   — infraestructura + SLO + n8n stats
#   2. aiops-automation   — Jenkins CI/CD + n8n workflows
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
    name: grafana-dashboards
    namespace: aiops
    labels:
        app: grafana
data:
    # ============================================================
    # Dashboard: Cluster Overview + SLO
    # ============================================================
    # Muestra el estado de infraestructura, disponibilidad de servicios
    # y error budget en un solo vistazo. Las annotations verticales
    # rojas marcan el momento exacto en que se disparó una alerta.
    # ============================================================
    cluster-overview.json: |
        {
          "annotations": {
            "list": [
              {
                "builtIn": 1,
                "datasource": { "type": "datasource", "uid": "-- Grafana --" },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "type": "dashboard"
              },
              {
                "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
                "enable": true,
                "hide": false,
                "iconColor": "red",
                "name": "Alertas de Prometheus",
                "expr": "ALERTS{alertstate=\"firing\"}",
                "step": "60s",
                "titleFormat": "{{ alertname }}",
                "textFormat": "{{ summary }}",
                "type": "dashboard"
              }
            ]
          },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": { "unit": "percent", "decimals": 1, "max": 100, "min": 0 },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "id": 1,
              "title": "CPU Usage (%)",
              "type": "timeseries",
              "description": "Porcentaje de CPU utilizado (100 - idle). Muestra la carga real del nodo.",
              "targets": [
                {
                  "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                  "legendFormat": "{{instance}}",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": { "unit": "percent", "decimals": 1, "max": 100, "min": 0 },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "id": 2,
              "title": "Memory Usage (%)",
              "type": "timeseries",
              "description": "Porcentaje de memoria utilizada. La línea punteada roja marca el 85% (umbral de alerta HighMemoryUsage).",
              "targets": [
                {
                  "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100",
                  "legendFormat": "{{instance}}",
                  "refId": "A"
                }
              ],
              "thresholds": [
                {
                  "step": 1,
                  "value": 85,
                  "color": "red",
                  "line": true,
                  "fill": false,
                  "dashLength": 10,
                  "spaceLength": 10,
                  "op": "gt"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": { "unit": "percent", "decimals": 1, "max": 100, "min": 0 },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
              "id": 3,
              "title": "Disk Usage (%) — /",
              "type": "timeseries",
              "description": "Porcentaje de disco ocupado en la partición raíz. La línea punteada roja marca el 80% (umbral de alerta DiskSpaceLow).",
              "targets": [
                {
                  "expr": "(node_filesystem_size_bytes{mountpoint=\"/\"} - node_filesystem_free_bytes{mountpoint=\"/\"}) / node_filesystem_size_bytes{mountpoint=\"/\"} * 100",
                  "legendFormat": "{{instance}}",
                  "refId": "A"
                }
              ],
              "thresholds": [
                {
                  "step": 1,
                  "value": 80,
                  "color": "red",
                  "line": true,
                  "fill": false,
                  "dashLength": 10,
                  "spaceLength": 10,
                  "op": "gt"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "mappings": [
                    { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
                  ],
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "red" },
                      { "value": 1, "color": "green" }
                    ]
                  },
                  "decimals": 0,
                  "unit": "none"
                },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
              "id": 4,
              "title": "Service Status (up)",
              "type": "stat",
              "description": "Estado de cada target scrapeado por Prometheus. 1 = UP, 0 = DOWN.",
              "targets": [
                {
                  "expr": "up",
                  "legendFormat": "{{job}}",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "decimals": 2,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "red" },
                      { "value": 99, "color": "yellow" },
                      { "value": 99.9, "color": "green" }
                    ]
                  },
                  "min": 0,
                  "max": 100
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 6, "x": 0, "y": 16 },
              "id": 5,
              "title": "SLO — Grafana (24h)",
              "type": "stat",
              "description": "Disponibilidad de Grafana en las últimas 24 horas. Valor < 99.9% dispara la alerta GrafanaSLOBreach.",
              "targets": [
                {
                  "expr": "avg_over_time(up{job=\"grafana\"}[24h]) * 100",
                  "legendFormat": "Grafana",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "decimals": 2,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "red" },
                      { "value": 99, "color": "yellow" },
                      { "value": 99.9, "color": "green" }
                    ]
                  },
                  "min": 0,
                  "max": 100
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 6, "x": 6, "y": 16 },
              "id": 6,
              "title": "SLO — n8n (24h)",
              "type": "stat",
              "description": "Disponibilidad de n8n en las últimas 24 horas. Si n8n cae, el pipeline de auto-remediación se rompe.",
              "targets": [
                {
                  "expr": "avg_over_time(up{job=\"n8n\"}[24h]) * 100",
                  "legendFormat": "n8n",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "min",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" },
                      { "value": 20, "color": "yellow" },
                      { "value": 40, "color": "red" }
                    ]
                  },
                  "min": 0,
                  "max": 43.8
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 6, "x": 12, "y": 16 },
              "id": 7,
              "title": "Error Budget — Grafana",
              "type": "gauge",
              "description": "Minutos de downtime consumidos este mes (SLO: 99.9% = 43.8 min permitidos). Si se acerca al máximo, el SLO está en riesgo.",
              "targets": [
                {
                  "expr": "(1 - avg_over_time(up{job=\"grafana\"}[30d])) * 30 * 24 * 60",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "blue" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 6, "x": 18, "y": 16 },
              "id": 8,
              "title": "Pods Running",
              "type": "stat",
              "description": "Pods en estado Running en el namespace aiops. Si baja, algo se cayó.",
              "targets": [
                {
                  "expr": "count(kube_pod_status_phase{namespace=\"aiops\", phase=\"Running\"})",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "blue" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 0, "y": 21 },
              "id": 9,
              "title": "n8n — Workflow Executions",
              "type": "stat",
              "description": "Total de ejecuciones de workflows en n8n. Las métricas de n8n se scrapean desde /metrics.",
              "targets": [
                {
                  "expr": "sum(n8n_workflow_execution_duration_seconds_count)",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 8, "y": 21 },
              "id": 10,
              "title": "n8n — Active Workflows",
              "type": "stat",
              "description": "Workflows activos en n8n. Un workflow activo puede ser Cron o Webhook.",
              "targets": [
                {
                  "expr": "n8n_active_workflow_count",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "decimals": 2,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" },
                      { "value": 60, "color": "yellow" },
                      { "value": 120, "color": "red" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 16, "y": 21 },
              "id": 11,
              "title": "n8n — Avg Duration",
              "type": "stat",
              "description": "Duración promedio de ejecución de workflows (en segundos).",
              "targets": [
                {
                  "expr": "sum(n8n_workflow_execution_duration_seconds_sum) / sum(n8n_workflow_execution_duration_seconds_count)",
                  "refId": "A"
                }
              ]
            }
          ],
          "refresh": "30s",
          "schemaVersion": 39,
          "style": "dark",
          "tags": ["aiops", "cluster-overview", "slo"],
          "templating": {
            "list": [
              {
                "current": {},
                "hide": 0,
                "includeAll": false,
                "label": "Prometheus",
                "name": "DS_PROMETHEUS",
                "options": [],
                "query": "prometheus",
                "refresh": 1,
                "regex": "",
                "type": "datasource"
              }
            ]
          },
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "title": "Cluster Overview",
          "uid": "cluster-overview",
          "version": 2
        }

    # ============================================================
    # Dashboard: AIOps Automation Health
    # ============================================================
    # Monitorea el pipeline de CI/CD (Jenkins) y la automatización
    # de workflows (n8n). Demuestra que Jenkins y n8n no solo están
    # instalados — están siendo observados con métricas reales.
    # ============================================================
    aiops-automation.json: |
        {
          "annotations": {
            "list": [
              {
                "builtIn": 1,
                "datasource": { "type": "datasource", "uid": "-- Grafana --" },
                "enable": true,
                "hide": true,
                "iconColor": "rgba(0, 211, 255, 1)",
                "name": "Annotations & Alerts",
                "type": "dashboard"
              }
            ]
          },
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 1,
          "id": null,
          "links": [],
          "liveNow": false,
          "panels": [
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "blue" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
              "id": 1,
              "title": "Jenkins — Total Runs",
              "type": "stat",
              "description": "Total de ejecuciones de jobs en Jenkins (todas las ramas).",
              "targets": [
                {
                  "expr": "jenkins_runs_total_total",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" },
                      { "value": 1, "color": "red" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
              "id": 2,
              "title": "Jenkins — Failed Runs",
              "type": "stat",
              "description": "Ejecuciones fallidas de jobs en Jenkins. Si > 0, algo rompió el pipeline.",
              "targets": [
                {
                  "expr": "jenkins_runs_failure_total",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "percent",
                  "decimals": 1,
                  "min": 0,
                  "max": 100,
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "red" },
                      { "value": 80, "color": "yellow" },
                      { "value": 95, "color": "green" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
              "id": 3,
              "title": "Jenkins — Success Rate",
              "type": "stat",
              "description": "Porcentaje de builds exitosos (success / total * 100).",
              "targets": [
                {
                  "expr": "jenkins_runs_success_total / jenkins_runs_total_total * 100",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" },
                      { "value": 5, "color": "yellow" },
                      { "value": 10, "color": "red" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 0, "y": 5 },
              "id": 4,
              "title": "Jenkins — Queue Size",
              "type": "stat",
              "description": "Jobs en cola esperando un executor. Si crece, los pipelines están congestionados.",
              "targets": [
                {
                  "expr": "jenkins_queue_size_value",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "none",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 8, "y": 5 },
              "id": 5,
              "title": "Jenkins — Executors Online",
              "type": "stat",
              "description": "Executors disponibles en Jenkins. Si es 0, no se puede ejecutar ningún job.",
              "targets": [
                {
                  "expr": "default_jenkins_executors_online",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "decimals": 0,
                  "color": { "mode": "thresholds" },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      { "value": null, "color": "green" },
                      { "value": 120, "color": "yellow" },
                      { "value": 300, "color": "red" }
                    ]
                  }
                },
                "overrides": []
              },
              "gridPos": { "h": 5, "w": 8, "x": 16, "y": 5 },
              "id": 6,
              "title": "Jenkins — Last Build Duration",
              "type": "stat",
              "description": "Duración del último build (en segundos). Spikes pueden indicar problemas de rendimiento.",
              "targets": [
                {
                  "expr": "default_jenkins_builds_last_build_duration_milliseconds / 1000",
                  "refId": "A"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": { "unit": "none", "decimals": 0 },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
              "id": 7,
              "title": "Jenkins — Runs by Result",
              "type": "timeseries",
              "description": "Ejecuciones de jobs en el tiempo, desglosadas por resultado (success, failure, aborted).",
              "targets": [
                {
                  "expr": "jenkins_runs_success_total",
                  "legendFormat": "success",
                  "refId": "A"
                },
                {
                  "expr": "jenkins_runs_failure_total",
                  "legendFormat": "failure",
                  "refId": "B"
                },
                {
                  "expr": "jenkins_runs_aborted_total",
                  "legendFormat": "aborted",
                  "refId": "C"
                }
              ]
            },
            {
              "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
              "fieldConfig": {
                "defaults": { "unit": "s", "decimals": 1 },
                "overrides": []
              },
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
              "id": 8,
              "title": "n8n — Workflow Duration",
              "type": "timeseries",
              "description": "Duración de ejecución de workflows de n8n a lo largo del tiempo.",
              "targets": [
                {
                  "expr": "rate(n8n_workflow_execution_duration_seconds_sum[5m]) / rate(n8n_workflow_execution_duration_seconds_count[5m])",
                  "legendFormat": "avg duration",
                  "refId": "A"
                }
              ]
            }
          ],
          "refresh": "30s",
          "schemaVersion": 39,
          "style": "dark",
          "tags": ["aiops", "automation", "jenkins", "n8n"],
          "templating": {
            "list": [
              {
                "current": {},
                "hide": 0,
                "includeAll": false,
                "label": "Prometheus",
                "name": "DS_PROMETHEUS",
                "options": [],
                "query": "prometheus",
                "refresh": 1,
                "regex": "",
                "type": "datasource"
              }
            ]
          },
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "title": "AIOps Automation Health",
          "uid": "aiops-automation",
          "version": 1
        }
