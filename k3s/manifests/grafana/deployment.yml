# ============================================================
# Deployment de Grafana — con inyección de Vault Agent
# ============================================================
# Despliega Grafana con provisionamiento automático de datasources
# y dashboards.  La contraseña de admin se inyecta desde Vault
# dinámicamente mediante Vault Agent Injector — ningún secret
# hardcodeado en los manifests del repo.
#
# Flujo de inyección de secrets:
#   1. El pod se crea con annotations de Vault Agent
#   2. El MutatingWebhookInterceptor detecta las annotations
#   3. El Injector añade un init container (vault-agent-init)
#      y un volumen compartido (vault-secrets)
#   4. vault-agent-init se autentica con Vault usando su
#      ServiceAccount y obtiene el secret de grafana
#   5. vault-agent-init escribe el secret en /vault/secrets/admin-password
#   6. Grafana lee la contraseña desde el archivo inyectado
#      usando la convención __FILE (GF_SECURITY_ADMIN_PASSWORD__FILE)
#
# El patrón __FILE es una convención de Grafana que permite leer
# valores desde archivos en lugar de variables de entorno directas.
# Esto es compatible con la inyección de archivos de Vault Agent.
#
# Antes (Fase 1-4): La contraseña venía de un Kubernetes Secret estático
# Ahora (Fase 3):   La contraseña se inyecta desde Vault en runtime
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
    name: grafana # Nombre del Deployment
    namespace: aiops # Namespace del laboratorio AIOps
    labels:
        app: grafana # Etiqueta principal para selector y service
    annotations:
        # --- Annotations de Vault Agent Injector ---
        # Habilitar la inyección de Vault Agent en este pod
        vault.hashicorp.com/agent-inject: "true"
        # Rol de Vault que autoriza a este pod a leer secrets
        # Vinculado al ServiceAccount 'grafana' en el namespace 'aiops'
        vault.hashicorp.com/role: "grafana"
        # Secret a inyectar: path en Vault (kv-v2: secret/data/grafana)
        vault.hashicorp.com/agent-inject-secret-admin-password: "secret/data/grafana"
        # Template que define cómo se renderiza el archivo inyectado
        # {{- with secret "secret/data/grafana" }} obtiene el secret de Vault
        # {{ .Data.data.admin_password }} extrae el campo admin_password
        # El archivo se escribe en /vault/secrets/admin-password
        vault.hashicorp.com/agent-inject-template-admin-password: |
            {{- with secret "secret/data/grafana" -}}
            {{ .Data.data.admin_password }}
            {{- end }}
        # Solo usar el init container, no sidecar (los secrets no cambian en runtime)
        vault.hashicorp.com/agent-pre-populate-only: "true"
spec:
    replicas: 1 # Una sola réplica — suficiente para k3s single-node
    selector:
        matchLabels:
            app: grafana # Selector debe coincidir con las labels del pod
    template:
        metadata:
            labels:
                app: grafana
            # Las annotations de Vault se heredan del spec.metadata.annotations
            # El Injector las lee del pod template
        spec:
            serviceAccountName: grafana # ServiceAccount vinculado al rol de Vault
            securityContext:
                fsGroup: 472 # GID de Grafana; asegura permisos de escritura en volúmenes
            containers:
                - name: grafana
                  image: grafana/grafana:10.4.1 # Imagen oficial de Grafana, versión LTS
                  ports:
                      - containerPort: 3000 # Puerto HTTP de la UI de Grafana
                        name: http
                  env:
                      - name: GF_SECURITY_ADMIN_USER
                        value: admin # Usuario administrador predeterminado
                      # La variable con sufijo __FILE indica a Grafana que lea la contraseña
                      # desde un archivo.  Vault Agent Injector escribe el secret en
                      # /vault/secrets/admin-password y Grafana lo lee con este sufijo.
                      - name: GF_SECURITY_ADMIN_PASSWORD__FILE
                        value: /vault/secrets/admin-password # Ruta donde Vault inyecta el secret
                      - name: GF_AUTH_ANONYMOUS_ENABLED
                        value: "false" # Deshabilita acceso anónimo — requiere login
                      - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
                        value: /var/lib/grafana/dashboards/cluster-overview.json # Dashboard inicial al entrar
                  volumeMounts:
                      # --- Provisionamiento de datasources (Prometheus + Loki) ---
                      - name: grafana-datasources
                        mountPath: /etc/grafana/provisioning/datasources # Grafana carga datasources de aquí
                      # --- Proveedor de dashboards (auto-descubrimiento de JSON) ---
                      - name: grafana-dashboards-provider
                        mountPath: /etc/grafana/provisioning/dashboards # Config del provider de dashboards
                      # --- Dashboards pre-cargados (cluster-overview, etc.) ---
                      - name: grafana-dashboards
                        mountPath: /var/lib/grafana/dashboards # Dashboards JSON que el provider escanea
                      # --- Datos persistentes (SQLite, sesiones, preferencias) ---
                      - name: grafana-storage
                        mountPath: /var/lib/grafana # PVC para datos persistentes
                      # --- Secrets inyectados por Vault Agent ---
                      # El Injector crea automáticamente un volumen emptyDir en /vault/secrets
                      # y lo comparte entre el init container (vault-agent-init) y el
                      # contenedor principal.  No necesitamos montarlo manualmente — el
                      # Injector lo añade al pod spec dinámicamente.
                      #
                      # NOTA: El volumen grafana-admin-secret (Kubernetes Secret) se eliminó
                      # porque Vault Agent inyecta los secrets en /vault/secrets/. Ya no
                      # necesitamos un Secret estático de Kubernetes.
                  resources:
                      requests: # Recursos mínimos garantizados — evita starvation
                          memory: "128Mi"
                          cpu: "100m"
                      limits: # Tope máximo — evita que Grafana consuma todo el nodo
                          memory: "512Mi"
                          cpu: "250m"
                  readinessProbe: # Verifica que Grafana puede recibir tráfico
                      httpGet:
                          path: /api/health # Endpoint de salud interna de Grafana
                          port: 3000
                      initialDelaySeconds: 10 # Espera 10s antes de la primera comprobación
                      periodSeconds: 10 # Comprueba cada 10s
                      failureThreshold: 3 # Tras 3 fallos consecutivos, marca como no listo
            volumes:
                # ConfigMap: datasources pre-provisionados
                - name: grafana-datasources
                  configMap:
                      name: grafana-datasources # Debe coincidir con el ConfigMap creado en configmap.yml
                # ConfigMap: proveedor de dashboards
                - name: grafana-dashboards-provider
                  configMap:
                      name: grafana-dashboards-provider # Debe coincidir con el ConfigMap creado en configmap.yml
                # ConfigMap: dashboards JSON pre-cargados
                - name: grafana-dashboards
                  configMap:
                      name: grafana-dashboards # Debe coincidir con el ConfigMap creado en dashboard-configmap.yml
                # PVC: almacenamiento persistente para estado de Grafana
                - name: grafana-storage
                  persistentVolumeClaim:
                      claimName: grafana-pvc # Debe coincidir con el PVC creado en pvc.yml
                # NOTA: El volumen grafana-admin-secret (Kubernetes Secret) se eliminó.
                # Vault Agent Injector inyecta los secrets en /vault/secrets/ mediante
                # un volumen emptyDir compartido entre el init container y Grafana.
