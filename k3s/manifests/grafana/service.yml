# ============================================================
# Service de Grafana
# ============================================================
# Expone Grafana con NodePort por un bug en el Ingress de Traefik
# en k3s que causa 502 en todos los host-based routes.
# Acceso directo: http://<node-ip>:30300
# ============================================================

apiVersion: v1
kind: Service
metadata:
    name: grafana
    namespace: aiops
    labels:
        app: grafana
spec:
    type: NodePort
    ports:
        - port: 3000
          targetPort: http
          nodePort: 30300
          protocol: TCP
          name: http
    selector:
        app: grafana
