# ConfigMap de Prometheus — contiene la configuración de scrape y las reglas de alerta.
# Prometheus lee estos archivos al iniciar (arg --config.file) y los usa para:
#   1. Descubrir qué targets monitorear (scrape_configs)
#   2. Definir condiciones que disparan alertas (alert_rules.yml)
# Los ConfigMaps se montan como volumen de solo lectura; para recargar la config
# sin reiniciar el pod, usamos --web.enable-lifecycle y enviamos SIGHUP o POST a /-/reload.
#
# Arquitectura: Prometheus scraping métricas → evalúa reglas → dispara alertas
# hacia Alertmanager → Alertmanager envía webhook a n8n → n8n orquesta respuesta automática.

apiVersion: v1
kind: ConfigMap
metadata:
    name: prometheus-config
    namespace: aiops
    labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: aiops-lab
data:
    # -----------------------------------------------------------------------
    # prometheus.yml — configuración principal de Prometheus
    # -----------------------------------------------------------------------
    prometheus.yml: |
        # Intervalo global: cada cuánto Prometheus consulta los targets.
        # 15s es un buen balance entre granularidad y carga en un entorno de lab.
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        # Alerting: le dice a Prometheus dónde enviar las alertas que disparan las reglas.
        alerting:
          alertmanagers:
            - static_configs:
                - targets:
                    - alertmanager:9093

        # Archivo de reglas de alerta — se carga desde el mismo ConfigMap (volumen compartido).
        rule_files:
          - alert_rules.yml

        scrape_configs:
          # -----------------------------------------------------------------
          # 1. Prometheus se monitorea a sí mismo (self-scrape).
          #    Útil para verificar que el servidor está corriendo y para métricas
          #    internas como el número de series temporales activas.
          # -----------------------------------------------------------------
          - job_name: "prometheus"
            static_configs:
              - targets:
                  - "localhost:9090"

          # -----------------------------------------------------------------
          # 2. Node Exporter — métricas del host (CPU, memoria, disco, red).
          #    Corre como DaemonSet con hostNetwork y hostPID para ver las métricas
          #    reales del nodo, no las del contenedor aislado.
          #    El Service node-exporter expone 9100 en el namespace aiops.
          # -----------------------------------------------------------------
          - job_name: "node-exporter"
            static_configs:
              - targets:
                  - "node-exporter.aiops:9100"

          # -----------------------------------------------------------------
          # 3. k3s kubelet metrics — métricas de cAdvisor del kubelet.
          #    k3s expone métricas de contenedores en /metrics/cadvisor del kubelet.
          #    Usamos kubernetes_sd_configs con role "node" para descubrir los nodos
          #    automáticamente en lugar de hardcodear IPs.
          #    Requiere autenticación con ServiceAccount token y TLS con
          #    insecure_skip_verify porque k3s usa certificados auto-firmados.
          # -----------------------------------------------------------------
          - job_name: "k3s-kubelet"
            scheme: https
            metrics_path: /metrics/cadvisor
            kubernetes_sd_configs:
              - role: node
            tls_config:
              # k3s genera certificados auto-firmados; sin esto Prometheus rechaza la conexión.
              insecure_skip_verify: true
            authorization:
              # El token del ServiceAccount montado automáticamente en el pod.
              # Permite a Prometheus autenticarse contra el kubelet.
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

          # -----------------------------------------------------------------
          # 4. n8n — expone métricas de workflows (ejecuciones, fallos, latencia).
          #    El endpoint /metrics debe estar habilitado en el deployment de n8n
          #    con la variable de entorno N8N_METRICS=true.
          # -----------------------------------------------------------------
          - job_name: "n8n"
            static_configs:
              - targets:
                  - "n8n.aiops.svc.cluster.local:5678"
            metrics_path: /metrics

          # -----------------------------------------------------------------
          # 5. Alertmanager — métricas internas de Alertmanager (alertas recibidas,
          #    notificaciones enviadas, errores de webhook). Permite monitorear que
          #    el propio pipeline de alertas funciona correctamente.
          # -----------------------------------------------------------------
          - job_name: "alertmanager"
            static_configs:
              - targets:
                  - "alertmanager:9093"

          # -----------------------------------------------------------------
          # 6. Jenkins — métricas del servidor CI/CD (builds ejecutados,
          #    duración de pipelines, tasa de fallos, estado de agentes).
          #    Jenkins expone métricas en /prometheus gracias al plugin
          #    "Prometheus Metrics".  Esto permite monitorear la salud
          #    del pipeline de CI/CD desde Grafana.
          # -----------------------------------------------------------------
          - job_name: "jenkins"
            static_configs:
              - targets:
                  - "jenkins.aiops.svc.cluster.local:8080"
            metrics_path: /prometheus

          # -----------------------------------------------------------------
          # 7. Grafana — métricas del servidor de dashboards.
          #    Se usa para medir SLO de disponibilidad de la UI del stack.
          #    La métrica up{job="grafana"} alimenta la alerta GrafanaSLOBreach
          #    y los paneles de disponibilidad en el dashboard.
          # -----------------------------------------------------------------
          - job_name: "grafana"
            static_configs:
              - targets:
                  - "grafana.aiops.svc.cluster.local:3000"

    # -----------------------------------------------------------------------
    # alert_rules.yml — reglas de alerta evaluadas por Prometheus cada 15s.
    # Cuando una expresión PromQL evalúa a true, Prometheus crea una alerta
    # y la envía a Alertmanager para que aplique routing y notificación.
    #
    # Cada alerta tiene un label severity (critical o warning). Alertmanager
    # usa este label para hacer routing diferenciado: las alertas critical
    # se notifican con group_wait=10s (respuesta rápida), mientras que las
    # warning esperan 30s antes de agrupar (evitan ruido por picos transitorios).
    # -----------------------------------------------------------------------
    alert_rules.yml: |
        groups:
          # -----------------------------------------------------------------
          # Grupo: aiops.rules — reglas de alerta del AIOps Lab.
          # Cada regla está conectada a al menos otra capa del stack:
          #   - Las alertas disparan webhooks de Alertmanager hacia n8n.
          #   - Las annotations alimentan el dashboard de Grafana.
          #   - Las métricas de SLO miden la confiabilidad real del sistema.
          # -----------------------------------------------------------------
          - name: aiops.rules
            rules:

              # -----------------------------------------------------------------
              # 1. Pod en CrashLoopBackOff — el pod reinicia repetidamente.
              #    rate() sobre 5m suaviza reinicios momentáneos de rolling updates.
              #    severity: critical — un pod que no arranca es pérdida de servicio.
              # -----------------------------------------------------------------
              - alert: PodCrashLooping
                expr: |
                  rate(kube_pod_container_status_restarts_total{namespace="aiops"}[5m]) > 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Pod {{ $labels.pod }} está en CrashLoopBackOff"
                  description: "El pod {{ $labels.pod }} reinició {{ $value | printf \"%.0f\" }} veces en los últimos 5 minutos."

              # -----------------------------------------------------------------
              # 2. Memoria del cluster por encima del 85%.
              #    Usa métricas del node_exporter (MemTotal - MemAvailable).
              #    severity: warning — el nodo todavía funciona pero está al límite.
              # -----------------------------------------------------------------
              - alert: HighMemoryUsage
                expr: |
                  (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
                  / node_memory_MemTotal_bytes * 100 > 85
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Memoria del nodo por encima del 85%"
                  description: "Uso actual: {{ $value | printf \"%.1f\" }}%"

              # -----------------------------------------------------------------
              # 3. Espacio en disco por encima del 80% de uso.
              #    Monitorea la partición raíz (/) que es donde k3s guarda
              #    imágenes de contenedores, volúmenes y logs.
              #    for=10m: el disco no se llena instantáneamente; 10 minutos
              #    evitan falsos positivos por escrituras transitorias de logs.
              #    severity: warning — un disco lleno degrada el cluster entero.
              # -----------------------------------------------------------------
              - alert: DiskSpaceLow
                expr: |
                  (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"})
                  / node_filesystem_size_bytes{mountpoint="/"} * 100 > 80
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Espacio en disco bajo"
                  description: "Disco raíz al {{ $value | printf \"%.1f\" }}% de capacidad."

              # -----------------------------------------------------------------
              # 4. n8n no responde — el orquestador de automatización caído.
              #    Si n8n no responde, ninguna alerta va a ser procesada
              #    automáticamente. Esto es un single point of failure del stack.
              #    severity: critical — requiere atención inmediata.
              # -----------------------------------------------------------------
              - alert: N8nDown
                expr: up{job="n8n"} == 0
                for: 1m
                labels:
                  severity: critical
                annotations:
                  summary: "n8n no responde"
                  description: "El servicio de n8n lleva más de 1 minuto sin responder al scrape."

              # -----------------------------------------------------------------
              # 5. SLO de Grafana incumplido — disponibilidad < 99.9% en la última hora.
              #    avg_over_time() calcula el promedio de up en una ventana móvil.
              #    < 0.999 significa más de ~3.6 segundos de downtime en una hora.
              #    severity: critical — la UI de observabilidad debe estar siempre disponible.
              # -----------------------------------------------------------------
              - alert: GrafanaSLOBreach
                expr: |
                  avg_over_time(up{job="grafana"}[1h]) < 0.999
                labels:
                  severity: critical
                annotations:
                  summary: "SLO de Grafana incumplido"
                  description: "Disponibilidad en la última hora: {{ $value | printf \"%.3f\" }}. SLO objetivo: 99.9%"

              # -----------------------------------------------------------------
              # 6. CPU del nodo por encima del 80% durante 5 minutos.
              #    for=5m evita falsas alertas por picos momentáneos (ej. un cron
              #    job que sube la CPU por 30 segundos no dispara la alerta).
              #    severity: warning — no es crítico pero merece atención.
              # -----------------------------------------------------------------
              - alert: HighCPU
                expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "CPU alta en {{ $labels.instance }}"
                  description: "El uso de CPU es mayor al 80% hace más de 5 minutos (valor actual: {{ $value | printf \"%.1f\" }}%)."

              # -----------------------------------------------------------------
              # 7. Servicio caído (genérico) — cualquier target deja de responder.
              #    up==0 significa que el último scrape falló. Complementa las
              #    alertas específicas (N8nDown, GrafanaSLOBreach) cubriendo
              #    cualquier servicio no contemplado explícitamente.
              #    severity: critical — pérdida de visibilidad o funcionalidad.
              # -----------------------------------------------------------------
              - alert: ServiceDown
                expr: up == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Servicio {{ $labels.job }} caído en {{ $labels.instance }}"
                  description: "El target {{ $labels.job }}/{{ $labels.instance }} no responde al scrape hace 2 minutos."
