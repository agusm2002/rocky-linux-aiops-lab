# ============================================================
# kube-state-metrics — métricas de estado de objetos K8s
# ============================================================
# Expone métricas sobre el estado de pods, deployments, nodos,
# etc. consultando la API de Kubernetes. A diferencia del kubelet
# (que expone métricas de contenedores via cAdvisor), kube-state-metrics
# expone el estado lógico: ¿el pod está Running? ¿cuántos reinicios?
# ¿el deployment tiene todas sus réplicas?
#
# Esto alimenta:
#   - Panel "Pods Running" en el dashboard de Grafana
#   - Alerta PodCrashLooping en Prometheus
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
    name: kube-state-metrics
    namespace: aiops
    labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: aiops-lab

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
    name: kube-state-metrics
    labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: aiops-lab
rules:
    - apiGroups: [""]
      resources:
          - pods
          - nodes
          - namespaces
          - persistentvolumeclaims
          - services
      verbs: ["list", "watch"]
    - apiGroups: ["apps"]
      resources:
          - deployments
          - replicasets
          - statefulsets
          - daemonsets
      verbs: ["list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
    name: kube-state-metrics
    labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: aiops-lab
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: ClusterRole
    name: kube-state-metrics
subjects:
    - kind: ServiceAccount
      name: kube-state-metrics
      namespace: aiops

---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: kube-state-metrics
    namespace: aiops
    labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: aiops-lab
spec:
    replicas: 1
    selector:
        matchLabels:
            app.kubernetes.io/name: kube-state-metrics
    template:
        metadata:
            labels:
                app.kubernetes.io/name: kube-state-metrics
                app.kubernetes.io/part-of: aiops-lab
        spec:
            serviceAccountName: kube-state-metrics
            containers:
                - name: kube-state-metrics
                  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
                  ports:
                      - name: http-metrics
                        containerPort: 8080
                      - name: telemetry
                        containerPort: 8081
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
    name: kube-state-metrics
    namespace: aiops
    labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: aiops-lab
spec:
    selector:
        app.kubernetes.io/name: kube-state-metrics
    ports:
        - name: http-metrics
          port: 8080
          targetPort: 8080
