# ServiceAccount, ClusterRole y ClusterRoleBinding para Prometheus.
#
# Prometheus necesita permisos RBAC para:
#   - Descubrir nodos del cluster (kubernetes_sd_configs con role "node")
#   - Leer métricas del kubelet (path /metrics/cadvisor)
#
# Sin estos permisos, el scrape config "k3s-kubelet" falla con erroes 403.
# El ClusterRole es a nivel de cluster (no namespace) porque los nodos son
# recursos de cluster en Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: aiops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aiops-lab
---
# ClusterRole: define qué permisos tiene Prometheus sobre la API de Kubernetes.
# Solo se le otorgan los permisos mínimos necesarios (principio de menor privilegio).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-aiops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aiops-lab
rules:
  # nodes/metrics: permiso para leer los endpoints de métricas del kubelet
  # (usado por el scrape config k3s-kubelet con /metrics/cadvisor).
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  # services, endpoints, pods: necesarios para kubernetes_sd_configs si se
  # agregan másJobs de descubrimiento en el futuro.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding: asocia el ClusterRole con el ServiceAccount.
# Vincula prometheus-aiops (ClusterRole) con el ServiceAccount prometheus
# del namespace aiops. Esto permite al pod usar estos permisos.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-aiops
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aiops-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-aiops
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: aiops
