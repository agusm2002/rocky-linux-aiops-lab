# Deployment de Alertmanager — gestiona el routing y la notificación de alertas.
#
# En el stack AIOps, Alertmanager es el intermediario entre Prometheus y n8n:
#   - Recibe alertas de Prometheus
#   - Agrupa alertas duplicadas o relacionadas (deduplicación)
#   - Envía notificaciones vía webhook a n8n
#   - Maneja silencios y inhibiciones (futuro: silenciar alertas durante mantenimiento)
#
# Notas de diseño:
# - 1 réplica en single-node k3s
# - No necesita PVC grande — solo guarda estado de silencios y notificaciones en curso
# - No corre como non-root porque tiene su propio usuario (am) en la imagen oficial

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiops-lab
spec:
  # Una sola réplica — no hay segundo nodo para HA en k3s single-node.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: aiops-lab
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            # Configuración principal — montada desde el ConfigMap.
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            # Directorio de datos — persiste estado de silencios y notificaciones.
            - "--storage.path=/alertmanager"

          ports:
            - name: http
              containerPort: 9093

          # Resources: Alertmanager es ligero — solo gestiona routing de alertas.
          # 64Mi request / 128Mi limit es suficiente para un lab con pocas alertas.
          # CPU mínima: 50m request (5% de un core), 200m limit (20% de un core).
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          volumeMounts:
            # ConfigMap con alertmanager.yml — configuración de routing y webhook.
            - name: config-volume
              mountPath: /etc/alertmanager
            # Datos de silencios y estado de notificaciones — montaje vacío
            # para persistencia con un PVC (opcional en lab single-node).
            - name: data-volume
              mountPath: /alertmanager

      volumes:
        # ConfigMap leído como archivos — Alertmanager lee alertmanager.yml al iniciar.
        - name: config-volume
          configMap:
            name: alertmanager-config
        # emptyDir para datos de Alertmanager — en un lab un reinicio del pod
        # pierde silencios activos, lo cual es aceptable. Para producción,
        # reemplazar por un PVC como el de Prometheus.
        - name: data-volume
          emptyDir: {}
