# Service de Alertmanager — expone Alertmanager dentro del cluster.
#
# Puerto 9093: puerto estándar de Alertmanager (diferente al 9090 de Prometheus).
# ClusterIP: acceso interno únicamente. Prometheus se conecta internamente
# usando el DNS alertmanager.aiops:9093 (definido en alerting.alertmanagers
# en la configuración de Prometheus).
#
# Grafana también puede usar este Service para consultar alertas activas
# y mostrarlas en dashboards (data source de Alertmanager).

apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: aiops
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: aiops-lab
spec:
  # ClusterIP: solo accesible dentro del cluster — no exponemos Alertmanager
  # directamente al exterior. Acceso desde el host via port-forward si es necesario.
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: 9093
      protocol: TCP
  # Selector coincide con los labels del template del Deployment de Alertmanager.
  selector:
    app.kubernetes.io/name: alertmanager
