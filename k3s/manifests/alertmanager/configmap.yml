# ConfigMap de Alertmanager — configuración de routing y notificaciones.
#
# Arquitectura de alertas en el stack AIOps:
#   Prometheus evalúa reglas → genera alertas → las envía a Alertmanager
#   → Alertmanager agrupa, deduplica y enruta → envía webhook a n8n
#   → n8n ejecuta workflows de respuesta automática.
#
# ¿Por qué n8n como receptor único?
# No enviamos emails ni Slack directamente. En su lugar, toda alerta llega a n8n
# via webhook, y n8n decide qué workflow ejecutar (notificar por email, crear
# ticket en Jira, reiniciar un pod, escalar, etc.). Esto centraliza la lógica
# de respuesta en un solo lugar — el orquestador de ITOps.

apiVersion: v1
kind: ConfigMap
metadata:
    name: alertmanager-config
    namespace: aiops
    labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/part-of: aiops-lab
data:
    alertmanager.yml: |
        # Configuración global de rutas y receptores de Alertmanager.
        global:
            # Tiempo que espera antes de enviar notificación de una alerta que se resolvió
            # pero nunca fue notificada. Evita notificar alertas fugaces.
            resolve_timeout: 5m

        # Definición de rutas — cómo se agrupan y enrutan las alertas.
        #
        # Estrategia de routing por severidad:
        #   - critical: group_wait=10s, renotifica cada 1h. Respuesta rápida porque
        #     son incidentes que requieren acción inmediata (pod caído, servicio down).
        #   - warning: group_wait=30s (default). Más tolerantes porque son condiciones
        #     que se pueden degradar pero no son outages (CPU alta, memoria al límite).
        #
        # Ambas severidades llegan al mismo webhook de n8n, pero n8n puede
        # diferenciarlas por el label severity en el payload JSON de Alertmanager
        # y ejecutar workflows distintos según criticidad.
        route:
            # group_by: agrupa alertas con el mismo alertname y severity.
            # Incluir severity en el group_by evita que alertas warning y critical
            # del mismo nombre se mezclen en una sola notificación.
            group_by: ["alertname", "severity"]

            # Valores por defecto (aplican a rutas que no los sobrescriben).
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h

            # Receptor por defecto.
            receiver: n8n-webhook

            # Sub-rutas: Alertmanager evalúa en orden y aplica la primera que
            # coincide. Las alertas con severity=critical toman la ruta rápida.
            routes:
                # Ruta para alertas críticas — menor latencia de notificación.
                # group_wait=10s: solo espera 10 segundos para agrupar antes de
                # enviar el primer webhook. En un incidente real, 10s vs 30s
                # puede ser la diferencia entre respuesta automática inmediata
                # y un minuto de downtime evitable.
                - match:
                    severity: critical
                  group_wait: 10s
                  group_interval: 2m
                  repeat_interval: 1h
                  receiver: n8n-webhook

                # Ruta para alertas warning — usa los defaults (30s, 5m, 4h).
                # No se sobrescribe nada; solo se declara para que sea explícito
                # en la configuración qué severidad sigue qué camino.
                - match:
                    severity: warning
                  receiver: n8n-webhook

        # Receptores — destinos de las notificaciones.
        receivers:
            - name: n8n-webhook
              webhook_configs:
                  # URL del webhook de n8n — n8n expone este endpoint cuando se crea
                  # un workflow con trigger "Webhook". El path /webhook/alertmanager
                  # es una convención del proyecto; el workflow en n8n debe escuchar en este path.
                  - url: "http://n8n.aiops.svc.cluster.local:5678/webhook/alertmanager"
                    # send_resolved: envía también notificaciones cuando la alerta se resuelve.
                    # Esto permite que n8n ejecute workflows de "recuperación" (ej. cerrar ticket,
                    # notificar que el servicio volvió a estar operativo).
                    send_resolved: true
