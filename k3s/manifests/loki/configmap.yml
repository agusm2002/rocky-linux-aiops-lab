# ConfigMap para Loki — configura el servidor de logs en modo single-node.
# Usa la configuración mínima y probada para Loki 2.9.x con filesystem local.
# El error "mkdir : no such file or directory" se produce cuando
# boltdb_shipper.shared_store apunta a "filesystem" pero falta el
# campo directory en filesystem. En 2.9.x, el esquema de almacenamiento
# se configura completamente en storage_config, no en common.
#
# Referencia: https://grafana.com/docs/loki/v2.9.x/configuration/
apiVersion: v1
kind: ConfigMap
metadata:
    name: loki-config
    namespace: aiops
data:
    loki.yml: |
        auth_enabled: false
        server:
          http_listen_port: 3100
          grpc_listen_port: 9096
        common:
          ring:
            instance_addr: 127.0.0.1
            kvstore:
              store: inmemory
          replication_factor: 1
        schema_config:
          configs:
            - from: 2024-04-01
              store: boltdb-shipper
              object_store: filesystem
              schema: v11
              index:
                prefix: index_
                period: 24h
        storage_config:
          boltdb_shipper:
            active_index_directory: /loki/boltdb-shipper-active
            cache_location: /loki/boltdb-shipper-cache
            shared_store: filesystem
          filesystem:
            directory: /loki/storage
        limits_config:
          reject_old_samples: true
          max_query_length: 721h
          allow_structured_metadata: false
          retention_period: 744h
        compactor:
          working_directory: /loki/compactor
          compaction_interval: 10m
          retention_enabled: true
        # Ingester: configuración del WAL (Write-Ahead Log).
        # Por defecto Loki intenta crear /wal, pero el pod corre como usuario no-root
        # sin permisos para crear directorios en /. Configuramos el WAL dentro
        # del directorio de datos montado en el PVC.
        ingester:
          wal:
            dir: /loki/storage/wal
        analytics:
          reporting_enabled: false
