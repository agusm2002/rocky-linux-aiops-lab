# ServiceAccount para Jenkins — identidad que Jenkins usa para interactuar
# con la API de Kubernetes.  El plugin de Kubernetes de Jenkins necesita
# este ServiceAccount para crear pods dinámicos como agentes de build.
# Sin este ServiceAccount y su RBAC correspondiente, Jenkins no puede
# crear agentes en el cluster (error 403 Forbidden).
apiVersion: v1
kind: ServiceAccount
metadata:
    name: jenkins
    namespace: aiops
    labels:
        app: jenkins
        app.kubernetes.io/part-of: aiops-lab
