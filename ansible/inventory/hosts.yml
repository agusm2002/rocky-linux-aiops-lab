---
# Inventario Ansible — Rocky Linux AIOps Lab
# Ejecución local dentro de la VM
# Cuando se ejecute desde la Mac, usar conexión SSH con los parámetros comentados

all:
    hosts:
        rocky-aiops:
            ansible_host: localhost
            ansible_connection: local
            ansible_python_interpreter: /usr/bin/python3
            # Para ejecución desde la Mac:
            # ansible_host: 192.168.64.x  # IP de la VM
            # ansible_port: 2222
            # ansible_user: agustinm
            # ansible_ssh_private_key_file: ~/.ssh/id_ed25519
