---
# Inventario Ansible — Oracle Cloud
# Las IPs se toman de variables de entorno (export después de tofu apply).

all:
  children:
    bastion:
      hosts:
        vm-bastion:
          ansible_host: "{{ lookup('env', 'BASTION_PUBLIC_IP') }}"
          ansible_user: rocky
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
          ansible_python_interpreter: /usr/bin/python3

    k3s:
      hosts:
        vm-k3s:
          ansible_host: "{{ lookup('env', 'K3S_PRIVATE_IP') }}"
          ansible_user: rocky
          ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
          ansible_python_interpreter: /usr/bin/python3
          ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -o StrictHostKeyChecking=no rocky@{{ lookup(''env'', ''BASTION_PUBLIC_IP'') }}"'
