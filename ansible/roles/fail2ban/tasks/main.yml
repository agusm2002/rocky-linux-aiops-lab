---
# Rol: fail2ban
# Protege contra ataques de fuerza bruta en SSH
# Documentado en Fase 8: Seguridad para Producción

- name: Install fail2ban
  dnf:
    name: fail2ban
    state: present

- name: Configure SSH jail
  copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = {{ ssh_port | default(22) }}
      maxretry = 5
      bantime = 3600
      findtime = 600

- name: Start and enable fail2ban
  systemd:
    name: fail2ban
    state: started
    enabled: true
