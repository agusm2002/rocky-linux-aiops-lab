---
# Rol ssh-hardening — Endurecimiento del servicio SSH
# Cambia el puerto, deshabilita root login y controla autenticación por password.
#
# IMPORTANTE:
# - PasswordAuthentication se controla con la variable ssh_password_auth.
#   Por defecto false (hardening completo). Cambiar a true solo para debug.
# - El puerto SSH es 2222 por defecto. Si se cambia, firewalld y SELinux
#   se actualizan automáticamente.

- name: Instalar el servicio SSH
  ansible.builtin.dnf:
      name: openssh-server
      state: present

- name: Deshabilitar login root
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: "^#?PermitRootLogin"
      line: "PermitRootLogin no"
      validate: "sshd -t -f %s"

- name: Configurar autenticación por password
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: "^#?PasswordAuthentication"
      line: "PasswordAuthentication {{ 'yes' if ssh_password_auth else 'no' }}"
      validate: "sshd -t -f %s"

- name: Configurar MaxAuthTries
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: "^#?MaxAuthTries"
      line: "MaxAuthTries {{ ssh_max_auth_tries }}"
      validate: "sshd -t -f %s"

- name: Configurar LoginGraceTime
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: "^#?LoginGraceTime"
      line: "LoginGraceTime {{ ssh_login_grace_time }}"
      validate: "sshd -t -f %s"

- name: Cambiar puerto SSH (solo si es diferente de 22)
  ansible.builtin.lineinfile:
      path: /etc/ssh/sshd_config
      regexp: "^#?Port "
      line: "Port {{ ssh_port }}"
      validate: "sshd -t -f %s"
  when: ssh_port != 22
  notify: Restart sshd

- name: Verificar si el puerto SSH custom ya está en SELinux
  ansible.builtin.shell:
      cmd: "semanage port -l | grep 'ssh_port_t' | grep -q '{{ ssh_port }}'"
  register: selinux_ssh_port_check
  changed_when: false
  failed_when: false
  when: ssh_port != 22

- name: Configurar SELinux para el nuevo puerto SSH
  ansible.builtin.command:
      cmd: semanage port -a -t ssh_port_t -p tcp {{ ssh_port }}
  when:
      - ssh_port != 22
      - selinux_ssh_port_check.rc != 0
  failed_when: false

- name: Restart sshd si se cambió el puerto
  ansible.builtin.meta: flush_handlers
